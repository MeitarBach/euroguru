<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
  <div class="bg">
    <div class="glow a"></div><div class="glow b"></div><div class="court"></div>
    <img class="mascot" src="{{mascot}}" alt="">
  </div>
  <div class="wrap">
    <header>
      <div class="brand"><img src="{{mascot}}" alt=""><span>EuroGuru</span></div>
      <div class="badge">{{badge}}</div>
    </header>
    <h1>{{title}}</h1>
    <div class="sub">{{subtitle}}</div>
    <div class="content">{{body}}</div>
    <footer>
      <span class="url">eurogurufantasy.com</span>
      <span class="pitch">Live fantasy points · stats · smart picks</span>
    </footer>
  </div>
</body>
</html>
