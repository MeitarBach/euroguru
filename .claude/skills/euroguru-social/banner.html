<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{css}}">
<style>
  html, body { width: 1500px; height: 500px; }
  .wrap { padding: 0 90px; justify-content: center; }
  .mascot { right: 50px; bottom: 50px; height: 380px; opacity: 0.9; }
  .court { right: 40px; width: 900px; height: 900px; }
  h1 { margin-top: 0; font-size: 62px; max-width: 760px; }
  .sub { font-size: 30px; margin-top: 18px; color: #ddd6fe; }
  .url { margin-top: 30px; font-size: 32px; font-weight: 800; }
  /* X covers the bottom-left corner with the profile photo. */
  .wrap { padding-left: 420px; }
</style>
</head>
<body>
  <div class="bg">
    <div class="glow a"></div><div class="glow b"></div><div class="court"></div>
    <img class="mascot" src="{{mascot}}" alt="">
  </div>
  <div class="wrap">
    <h1>EuroLeague Fantasy, live.</h1>
    <div class="sub">Live fantasy points · stats · smart picks · free</div>
    <div class="url">eurogurufantasy.com</div>
  </div>
</body>
</html>
