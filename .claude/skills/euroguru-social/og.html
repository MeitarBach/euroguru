<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{css}}">
<style>
  /* The link preview (og:image): 1200x630. X lays the page title over the bottom-left
     corner, so the bottom ~110px carries nothing that matters. */
  html, body { width: 1200px; height: 630px; }
  .glow.a { width: 700px; height: 700px; left: -200px; top: -260px; background: rgba(139, 92, 246, 0.5); }
  .glow.b { width: 620px; height: 620px; right: -160px; bottom: -280px; background: rgba(236, 72, 153, 0.28); }
  .court { right: -60px; width: 820px; height: 820px; }
  .mascot { right: 70px; top: 60px; bottom: auto; height: 400px; opacity: 1;
    filter: drop-shadow(0 20px 60px rgba(139, 92, 246, 0.45)); }
  .wrap { padding: 64px 72px 0; }
  .brand img { height: 56px; }
  .brand span { font-size: 34px; }
  h1 { margin-top: 44px; font-size: 76px; line-height: 1.02; letter-spacing: -2px; max-width: 640px; }
  .sub { margin-top: 20px; font-size: 27px; color: #ddd6fe; max-width: 640px; }
  .chips { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; max-width: 680px; }
  .chips span { font-size: 19px; font-weight: 700; padding: 9px 16px; border-radius: 999px; color: #e9d5ff;
    background: rgba(139, 92, 246, 0.18); border: 1px solid rgba(167, 139, 250, 0.45); }
</style>
</head>
<body>
  <div class="bg">
    <div class="glow a"></div><div class="glow b"></div><div class="court"></div>
    <img class="mascot" src="{{mascot}}" alt="">
  </div>
  <div class="wrap">
    <div class="brand"><img src="{{mascot}}" alt=""><span>EuroGuru</span></div>
    <h1>EuroLeague Fantasy, live.</h1>
    <div class="sub">Free stats, live fantasy points and smart picks for every round.</div>
    <div class="chips"><span>Live FPT</span><span>Player stats</span><span>Smart picks</span><span>Price tracker</span></div>
  </div>
</body>
</html>
